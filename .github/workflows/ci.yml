name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight run for the same branch+PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------
  # 1. Backend lint + test (Go)
  # ---------------------------------------------------------------
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      # libvirt headers aren't installed by default in GitHub Actions
      # runners. The packages that import libvirt.org/go/libvirt
      # only need the C headers at build time when CGO is enabled.
      - name: Install libvirt dev headers
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev pkg-config qemu-utils

      # //go:embed all:dist needs a real, non-empty frontend build — not
      # just a placeholder file. A bare `.gitkeep` satisfies the compiler
      # but leaves internal/frontend/dist with no index.html, so any test
      # exercising the SPA fallback (frontend_test.go) always 500s in CI
      # while passing locally (developers always run a real `npm run
      # build` first). Reuse the frontend job's own build instead of
      # duplicating it here — this is exactly the artifact it already
      # uploads.
      - name: Download frontend build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: backend/internal/frontend/dist

      - name: golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.6 run --timeout=5m

      - name: go test (with race detector + coverage)
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  # ---------------------------------------------------------------
  # 2. Frontend lint + test (TypeScript/Svelte)
  # ---------------------------------------------------------------
  frontend:
    name: Frontend (lint + format + build)
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: i18n key symmetry (en/es/ca)
        run: ../scripts/check-i18n.sh

      - name: No undefined components in Svelte templates
        run: ../scripts/check-undefined-components.sh

      - name: Unit tests (utils, node env — no jsdom)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ---------------------------------------------------------------
  # 3. Packaging + installer static checks (shell, no root needed)
  # ---------------------------------------------------------------
  packaging:
    name: Packaging (installer invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer static checks
        run: bash packaging/standalone/test-installer.sh
