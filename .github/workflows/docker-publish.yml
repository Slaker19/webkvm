name: Docker Publish

# Builds the release binary (same artifact the native installer/`make
# docker-build` uses, never compiled inside the image itself) and
# publishes the container image to Docker Hub as slaker1908/webkvm.
#
# Runs automatically on every version tag push (v1.1.2, v1.1.3, ...).
# Can also be triggered manually for an existing tag via workflow_dispatch,
# e.g. to (re)publish an image for a tag that predates this workflow.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag to build and publish (e.g. v1.1.2)"
        required: true

concurrency:
  group: docker-publish-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  docker:
    name: Build backend + publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # The git tag keeps its leading v (v0.0.1); the baked --version,
      # the image tag and the release artifacts use the bare number
      # (0.0.1), exactly like release.yml.
      - name: Determine version
        id: ver
        run: |
          TAG="${{ github.event.inputs.ref || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # libvirt headers are needed at build time for CGO, same as ci.yml.
      - name: Install libvirt dev headers
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev pkg-config

      - name: Build backend (embeds frontend)
        run: make build-backend VERSION=${{ steps.ver.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      # Build into the local Docker daemon only. Nothing is pushed until
      # the smoke test and the Trivy gate below have both passed, so a
      # broken or vulnerable image never reaches :latest.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            slaker1908/webkvm:${{ steps.ver.outputs.version }}
            slaker1908/webkvm:latest

      # Smoke test the locally built image: boot it against a real host
      # libvirtd (socket mounted, like docker-compose.yml does) and prove
      # HTTPS health is 200/"libvirt":"ok" plus a working admin login.
      # This catches entrypoint regressions AND binary/library mismatch
      # (e.g. libvirt symbols newer than the image's): a broken binary
      # never gets the container to green.
      - name: Smoke test image
        run: |
          sudo apt-get update && sudo apt-get install -y libvirt-daemon-system
          sudo systemctl start libvirtd
          sudo mkdir -p /tmp/smoke-data
          sudo docker run -d --name webkvm-smoke \
            -v /tmp/smoke-data:/opt/webkvm \
            -v /var/run/libvirt:/var/run/libvirt \
            -p 18080:8080 \
            slaker1908/webkvm:${{ steps.ver.outputs.version }}
          for i in $(seq 1 20); do
            sleep 6
            code=$(curl -k -s -o /dev/null -w '%{http_code}' --max-time 5 https://127.0.0.1:18080/api/health || true)
            [ "$code" = "200" ] && break
            if [ "$i" = "20" ]; then docker logs webkvm-smoke; exit 1; fi
          done
          curl -k -s --max-time 10 https://127.0.0.1:18080/api/health | grep -q '"libvirt":"ok"'
          PASS=$(sudo cat /tmp/smoke-data/admin-password.initial)
          curl -k -s --max-time 10 -X POST https://127.0.0.1:18080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$PASS\"}" | grep -q '"role":"admin"'
          docker rm -f webkvm-smoke

      # Fail on fixable HIGH/CRITICAL image CVEs. --ignore-unfixed lets
      # through upstream issues with no published patch (e.g. CVE-2026-3886
      # in qemu-utils, tracked as risk-accepted in SECURITY.md); anything
      # Ubuntu CAN fix must be fixed (rebuild picks it up) before publish.
      - name: Scan image (Trivy, fixable HIGH/CRITICAL gate)
        run: |
          curl -sL --max-time 300 -o /tmp/trivy.tar.gz 'https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz'
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            slaker1908/webkvm:${{ steps.ver.outputs.version }}

      # Gate passed: publish the exact image that was tested and scanned.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker push slaker1908/webkvm:${{ steps.ver.outputs.version }}
          docker push slaker1908/webkvm:latest
