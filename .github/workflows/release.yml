name: Release

# Builds the self-contained release tarball (embedded frontend + backend
# binary + CLI + installer scripts) and creates a GitHub release with the
# SHA256SUMS checksum file. Triggered automatically on any `v*` tag push,
# or manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to verify (e.g. v1.2.0)'
        required: false

# The build needs to create the GitHub release, so write access to
# contents is required.
permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  release:
    name: Build tarball + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tag history

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The backend imports libvirt.org/go/libvirt, which needs the C
      # headers at build time (CGO_ENABLED=1).
      - name: Install libvirt dev headers
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev pkg-config

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend binary + CLI (versioned)
        run: |
          cd backend
          mkdir -p internal/frontend/dist
          cp -r ../frontend/dist/* internal/frontend/dist/
          # On a tag push, git describe yields the tag (vX.Y.Z). On a
          # manual dispatch, the operator supplies the version explicitly.
          VERSION=${{ github.event.inputs.version || '' }}
          [ -n "$VERSION" ] || VERSION=$(git describe --tags --always)
          # Baked --version and artifact names use the bare number
          # (0.0.1), like local `make build` runs — never the v tag.
          BARE="${VERSION#v}"
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=1 go build -buildvcs=false \
            -ldflags "-s -w -X 'main.Version=$BARE' -X 'main.BuildTime=$BUILD_TIME'" \
            -o webkvm ./cmd/server/
          CGO_ENABLED=0 go build -buildvcs=false \
            -ldflags "-s -w -X 'main.Version=$BARE' -X 'main.BuildTime=$BUILD_TIME'" \
            -o webkvm-cli ./cmd/cli/
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Assemble dist (tarball + raw binaries + .deb/.rpm) + SHA256SUMS
        run: |
          # TAG keeps the leading v for gh ops; artifacts use the bare
          # number (0.0.1), the same one baked into --version above.
          TAG="${{ env.VERSION }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          tar -czf "dist/webkvm-$VERSION.tar.gz" \
            backend/webkvm \
            backend/webkvm-cli \
            install.sh \
            LICENSE CHANGELOG.md CHANGELOG.es.md \
            packaging/standalone/install.sh \
            packaging/standalone/uninstall.sh \
            packaging/standalone/update.sh \
            packaging/nfpm/webkvm.default \
            scripts/setup-network.sh scripts/setup-bridge.sh \
            scripts/webkvm.service \
            scripts/Caddyfile scripts/generate-self-signed.sh \
            scripts/install-caddy-systemd.sh scripts/install-webkvm.sh \
            scripts/smoke.sh \
            Makefile
          # Raw binaries for update.sh (it installs a binary, not a tarball).
          cp backend/webkvm "dist/webkvm-$VERSION-linux_amd64"
          cp backend/webkvm-cli "dist/webkvm-cli-$VERSION-linux_amd64"
          # Native packages (deb 0.0.1 / rpm 0.0.1-1 mapping).
          # NOTE: the yaml files read VERSION_DEB / VERSION_RPM /
          # VERSION_RPM_RELEASE (not DEB_VER) — a wrong name silently
          # builds 0.0.0 packages, which is how earlier prereleases first
          # shipped misversioned native packages.
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.3
          VERSION_DEB="$(echo "$VERSION" | tr '-' '~')" \
            nfpm package --config packaging/nfpm.deb.yaml --packager deb --target dist/
          VERSION_RPM="$(echo "$VERSION" | sed 's/-.*//')" \
          VERSION_RPM_RELEASE="$(echo "$VERSION" | grep -q -- '-' && echo "$VERSION" | sed 's/^[^-]*-/0./' || echo 1)" \
            nfpm package --config packaging/nfpm.rpm.yaml --packager rpm --target dist/
          # NOTE: the .deb sorts as webkvm_* (underscore); the glob must cover both.
          (cd dist && sha256sum webkvm-* webkvm_* > SHA256SUMS)
          echo "== artifacts =="
          ls -l dist/
          cat dist/SHA256SUMS
          # Fail closed: never publish a 0.0.0/dev native package (wrong
          # env names to nfpm silently produce those).
          # Debian filename convention is name_VERSION_arch (underscores).
          DEB_EXPECTED="webkvm_$(echo "$VERSION" | tr '-' '~')_amd64.deb"
          RPM_EXPECTED="webkvm-$(echo "$VERSION" | sed 's/-.*//')-$(echo "$VERSION" | grep -q -- '-' && echo "$VERSION" | sed 's/^[^-]*-/0./' || echo 1).x86_64.rpm"
          test -f "dist/$DEB_EXPECTED" || { echo "missing $DEB_EXPECTED:"; ls dist/; exit 1; }
          test -f "dist/$RPM_EXPECTED" || { echo "missing $RPM_EXPECTED:"; ls dist/; exit 1; }
          test -f "dist/webkvm-$VERSION-linux_amd64" || { echo "missing raw binary"; exit 1; }
          test -f "dist/webkvm-$VERSION.tar.gz" || { echo "missing tarball"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ env.TAG }}"
          # Idempotent: a re-run (workflow_dispatch, or a tag that already
          # has a release from a previous attempt) must not fail. Delete
          # any prior release for this tag (keeps the tag itself), then
          # recreate it with the freshly built artifacts.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — replacing it"
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" dist/* \
            --title "WebKVM $TAG" \
            --notes "Checksums in SHA256SUMS. Full changelog: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md" \
            --verify-tag